    <!-- Resilient WebSocket & HMR silent fallback -->
    <script>
      (function() {
        if (typeof window === 'undefined') return;
        
        // Suppress unhandled WebSocket rejections
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && (event.reason ? event.reason.message || String(event.reason) : '');
          if (reason && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('websocket') !== -1 || reason.indexOf('closed without opened') !== -1)) {
            event.preventDefault();
            event.stopPropagation();
          }
        });

        // Patch native WebSocket with silent fallback for sandbox environments
        var OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          window.WebSocket = function(url, protocols) {
            var urlStr = String(url || '');
            var isHmr = urlStr.indexOf('vite') !== -1 || urlStr.indexOf('hmr') !== -1 || urlStr.indexOf('3000') !== -1 || urlStr.indexOf('token=') !== -1;
            
            var ws;
            try {
              ws = protocols ? new OriginalWebSocket(url, protocols) : new OriginalWebSocket(url);
            } catch (err) {
              // Create silent mock fallback
              var noop = function() {};
              ws = {
                url: urlStr,
                readyState: 3, // CLOSED
                send: noop,
                close: noop,
                addEventListener: noop,
                removeEventListener: noop,
                dispatchEvent: function() { return false; }
              };
              return ws;
            }

            if (isHmr && ws && typeof ws.addEventListener === 'function') {
              ws.addEventListener('error', function(e) {
                if (e && typeof e.stopImmediatePropagation === 'function') {
                  e.stopImmediatePropagation();
                }
              });
            }

            return ws;
          };
          window.WebSocket.prototype = OriginalWebSocket.prototype;
          window.WebSocket.CONNECTING = OriginalWebSocket.CONNECTING;
          window.WebSocket.OPEN = OriginalWebSocket.OPEN;
          window.WebSocket.CLOSING = OriginalWebSocket.CLOSING;
          window.WebSocket.CLOSED = OriginalWebSocket.CLOSED;
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
